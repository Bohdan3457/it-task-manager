<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IT Task Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark text-white vh-100 px-3 pt-3 position-fixed">
                <h4 class="text-center py-2 border-bottom border-secondary">DevFlow</h4>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item mb-2">
                        <a href="{% url 'task_manager:index' %}" class="nav-link text-white active">
                            <i class="bi bi-house-door me-2"></i> Home
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="{% url 'task_manager:task-list' %}" class="nav-link text-white-50">
                            <i class="bi bi-list-task me-2"></i> Tasks
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="{% url 'task_manager:worker-list' %}" class="nav-link text-white-50">
                            <i class="bi bi-people me-2"></i> Workers
                        </a>
                    </li>
                </ul>
                <div class="position-absolute bottom-0 start-0 w-100 p-3 border-top border-secondary bg-dark text-center">
                    <small class="text-secondary">&copy; 2026 DevFlow</small>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4" style="margin-left: 16.666667%;">
                <div class="bg-white p-4 rounded shadow-sm">
                    {% block content %}
                    {% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

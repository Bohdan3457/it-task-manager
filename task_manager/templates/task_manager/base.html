<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevFlow - IT Task Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: #f8f9fa;
        }
        .wrapper {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar-container {
            width: 280px;
            flex-shrink: 0;
            background-color: #212529;
        }
        .content-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
        }
        .sidebar-link {
            transition: all 0.2s ease-in-out;
            border-radius: 0.375rem;
            opacity: 0.8;
        }
        .sidebar-link:hover {
            background-color: rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            opacity: 1;
            padding-left: 1rem;
        }
        .active-link {
            background-color: #0d6efd !important;
            color: #fff !important;
            opacity: 1;
            font-weight: 600;
        }
        .text-gradient {
            background: linear-gradient(45deg, #fff, #86b7fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="d-flex flex-column p-3 text-white sidebar-container">
        <a href="{% url 'task_manager:index' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <span class="fs-4 fw-bold text-gradient">🚀 DevFlow</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto gap-1">
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-2 mb-3 p-2 rounded" style="background-color: rgba(255, 255, 255, 0.05);">
                    <div class="d-flex align-items-center justify-content-center bg-primary rounded-circle text-white" style="width: 40px; height: 40px;">
                        <i class="bi bi-person-fill fs-5"></i>
                    </div>

                    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
                        <span class="fw-bold text-white text-truncate small">
                            {{ user.first_name|slice:":3" }}***
                        </span>
                        <form method="post" novalidate action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link text-danger p-0 border-0 small text-start">
                                <i class="bi bi-box-arrow-right"></i> Log out
                            </button>
                        </form>
                    </div> </div> {% else %}
                <div class="mb-3">
                    <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-box-arrow-in-right"></i> Log In
                    </a>
                </div>
            {% endif %}

            <li class="nav-item">
                <a href="{% url 'task_manager:index' %}" class="nav-link text-white sidebar-link {% if request.resolver_match.url_name == 'index' %}active-link{% endif %}">
                    <i class="bi bi-house-door me-2"></i> Home
                </a>
            </li>
            <li>
                <a href="{% url 'task_manager:task-list' %}" class="nav-link text-white sidebar-link {% if 'task' in request.resolver_match.url_name %}active-link{% endif %}">
                    <i class="bi bi-list-task me-2"></i> Tasks
                </a>
            </li>
            <li>
                <a href="{% url 'task_manager:worker-list' %}" class="nav-link text-white sidebar-link {% if 'worker' in request.resolver_match.url_name %}active-link{% endif %}">
                    <i class="bi bi-people me-2"></i> Workers
                </a>
            </li>
            <li>
                <a href="{% url 'task_manager:position-list' %}" class="nav-link text-white sidebar-link {% if 'position' in request.resolver_match.url_name %}active-link{% endif %}">
                    <i class="bi bi-briefcase me-2"></i> Positions
                </a>
            </li>
        </ul>
        <hr>
        <div class="text-muted small">
            © 2026 DevFlow
        </div>
    </div>

    <div class="content-container">
        {% block content %}
        {% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

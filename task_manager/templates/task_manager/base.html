<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskDesk{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-body: #f4f7fe;
            --sidebar-bg: #ffffff;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --hover-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.1), 0 8px 10px -6px rgba(79, 70, 229, 0.04);
            --border-color: #eef2f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1.25rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-logo {
            font-weight: 700;
            font-size: 1.35rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .nav-link-custom {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            font-weight: 500;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
            margin-bottom: 4px;
        }

        .nav-link-custom:hover {
            color: #4f46e5;
            background: #f8fafc;
            transform: translateX(3px);
        }

        .nav-link-custom.active {
            background: var(--primary-gradient);
            color: #ffffff !important;
            box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.35);
        }

        .main-wrapper {
            margin-left: 260px;
            padding: 2rem 2.5rem;
            min-height: 100vh;
        }

        @media (max-width: 991px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.show { transform: translateX(0); }
            .main-wrapper { margin-left: 0; padding: 1.5rem 1rem; }
        }

        .stat-card, .table-card, .profile-card, .detail-card, .form-card {
            background: #ffffff;
            border: 1px solid var(--border-color) !important;
            border-radius: 20px !important;
            box-shadow: var(--card-shadow) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow) !important;
        }

        .badge {
            padding: 0.45em 0.85em;
            font-weight: 600;
            border-radius: 8px;
            letter-spacing: 0.2px;
        }

        .bg-light { background-color: #f8fafc !important; color: #475569 !important; }
        .bg-success-subtle { background-color: #dcfce7 !important; color: #15803d !important; }
        .bg-warning-subtle { background-color: #fef3c7 !important; color: #b45309 !important; }
        .bg-danger-subtle { background-color: #fee2e2 !important; color: #b91c1c !important; }

        .table {
            --bs-table-bg: transparent;
        }
        .table thead th {
            background-color: #f8fafc;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }
        .table tbody td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            font-size: 0.9rem;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .table tbody tr:hover {
            background-color: #f8fafc;
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        .btn-light {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: #475569;
        }
        .btn-light:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #1e293b;
        }

        .form-control, .form-select {
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 0.65rem 1rem;
            font-size: 0.9rem;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div>
            <div class="mb-4 ps-2">
                <a href="{% url 'task_manager:index' %}" class="text-decoration-none brand-logo">
                    <i class="bi bi-kanban-fill text-primary"></i>
                    <span>TaskDesk</span>
                </a>
            </div>

            <nav class="nav flex-column">
                <a class="nav-link-custom {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
                   href="{% url 'task_manager:index' %}">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
                <a class="nav-link-custom {% if 'task' in request.resolver_match.url_name %}active{% endif %}"
                   href="{% url 'task_manager:task-list' %}">
                    <i class="bi bi-check-square-fill"></i> Tasks
                </a>
                <a class="nav-link-custom {% if 'worker' in request.resolver_match.url_name %}active{% endif %}"
                   href="{% url 'task_manager:worker-list' %}">
                    <i class="bi bi-people-fill"></i> Workers
                </a>
                <a class="nav-link-custom {% if 'position' in request.resolver_match.url_name %}active{% endif %}"
                   href="{% url 'task_manager:position-list' %}">
                    <i class="bi bi-briefcase-fill"></i> Positions
                </a>
            </nav>
        </div>

        <div class="pt-3 border-top border-light">
            <div class="d-flex align-items-center justify-content-between px-2">
                <div class="d-flex align-items-center gap-2">
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
                         style="width: 36px; height: 36px; font-size: 0.85rem;">
                        {{ user.username|first|upper }}
                    </div>
                    <div style="line-height: 1.2;">
                        <span class="fw-semibold d-block text-dark small">{{ user.username }}</span>
                        <span class="text-muted extra-small" style="font-size: 0.75rem;">Online</span>
                    </div>
                </div>
                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm text-muted hover-danger p-1" title="Logout">
                        <i class="bi bi-box-arrow-right fs-5"></i>
                    </button>
                </form>
                {% endif %}
            </div>
        </div>
    </aside>

    <main class="main-wrapper">
        <div class="d-lg-none mb-3 d-flex justify-content-between align-items-center">
            <button class="btn btn-light border" onclick="document.getElementById('sidebar').classList.toggle('show')">
                <i class="bi bi-list fs-4"></i>
            </button>
            <span class="fw-bold text-dark">TaskDesk</span>
        </div>

        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

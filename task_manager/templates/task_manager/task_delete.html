{% extends "task_manager/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1 text-danger">Delete Task</h1>
            <p class="text-muted">This action cannot be undone.</p>
        </div>
    </div>

    <div class="card border-danger mb-4" style="max-width: 600px;">
        <div class="card-body">
            <h5 class="card-title text-dark mb-3">
                Are you sure that you want to delete the task: <strong>"{{ task.name }}"</strong>?
            </h5>

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mt-4">
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    <a href="{% url 'task_manager:task-list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

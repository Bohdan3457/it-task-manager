{% extends "task_manager/base.html" %}

{% block title %}Delete Worker - TaskDesk{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
                <div class="text-danger mb-3">
                    <i class="bi bi-person-x-fill display-4"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Delete Worker</h4>
                <p class="text-muted mb-4">
                    Are you sure you want to delete worker <strong>"{{ object.username }}"</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'task_manager:worker-list' %}" class="btn btn-light border px-4 rounded-3 fw-medium">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger px-4 rounded-3 fw-medium">
                            Yes, Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "task_manager/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm p-4">
                <h2 class="mb-4">Create a new Worker</h2>

                <form method="post" novalidate>

                    {% csrf_token %}

                    {{ form|crispy }}

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary px-4">Create Worker</button>
                        <a href="{% url 'task_manager:worker-list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

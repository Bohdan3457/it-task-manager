{% extends "task_manager/base.html" %}

{% block title %}Task: {{ task.name }}{% endblock %}

{% block content %}
    <!-- Back to List Button -->
    <div class="mb-4">
        <a href="{% url 'task_manager:task-list' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to List
        </a>
    </div>

    <!-- Task Header -->
    <div class="d-flex align-items-center mb-3">
        <div class="bg-primary-subtle text-primary p-3 rounded me-3">
            <i class="bi bi-journal-check fs-3"></i>
        </div>
        <div>
            <span class="badge bg-info text-dark mb-1">Task Details</span>
            <h2 class="mb-0 fw-bold">{{ task.name }}</h2>
        </div>
    </div>

    <hr class="text-secondary my-4">

    <!-- Task Information -->
    <div class="row">
        <div class="col-md-8">
            <h5 class="text-muted fw-semibold mb-3">Description</h5>
            <div class="bg-light p-3 rounded border">
                <p class="mb-0">{{ task.description|default:"No description provided." }}</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 bg-light p-3">
                <h6 class="text-muted fw-semibold mb-3">Meta Info</h6>

                <div class="mb-3">
                    <small class="text-secondary d-block">Deadline</small>
                    <span class="fw-medium text-danger">
                        <i class="bi bi-calendar-event me-1"></i> {{ task.deadline }}
                    </span>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

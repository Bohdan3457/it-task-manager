{% extends "task_manager/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">Update Worker</h1>
        </div>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}

        {{ form|crispy }}

        <div class="mt-4">
            <button type="submit" class="btn btn-primary px-4">Update Worker</button>
            <a href="{% url 'task_manager:worker-list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
